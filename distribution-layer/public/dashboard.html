<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Content Distribution Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --bg: #0f1117; --card-bg: #171a23; --border: #262b38; --text: #e6e8ee;
    --muted: #8b92a5; --accent: #6c8cff; --linkedin: #0a66c2; --twitter: #1d9bf0;
    --instagram: #d6249f; --youtube: #ff0033;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 32px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
  h1 { font-size: 22px; margin: 0; }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }
  #refresh-btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  #count-badge { background: var(--card-bg); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 13px; color: var(--muted); margin-right: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px; border-top: 3px solid var(--accent); }
  .card.linkedin { border-top-color: var(--linkedin); }
  .card.twitter { border-top-color: var(--twitter); }
  .card.instagram { border-top-color: var(--instagram); }
  .card.youtube { border-top-color: var(--youtube); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .platform-tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; padding: 3px 8px; border-radius: 5px; background: rgba(255,255,255,0.08); }
  .timestamp { font-size: 11px; color: var(--muted); }
  .card-body { font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; color: var(--text); max-height: 220px; overflow-y: auto; }
  .status-pill { display: inline-block; margin-top: 12px; font-size: 11px; background: rgba(108,140,255,0.15); color: var(--accent); padding: 3px 10px; border-radius: 20px; }
  .empty-state { color: var(--muted); text-align: center; padding: 80px 20px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Content Distribution Dashboard</h1>
      <div class="subtitle">Live view of posts scheduled by the n8n pipeline</div>
    </div>
    <div>
      <span id="count-badge">0 posts</span>
      <button id="refresh-btn" onclick="loadPosts()">Refresh</button>
    </div>
  </header>
  <div id="grid" class="grid"></div>
  <script>
    function renderTwitter(body) {
      if (Array.isArray(body.thread)) return body.thread.join("\n\n");
      return JSON.stringify(body, null, 2);
    }
    function renderYoutube(body) {
      let out = `Title: ${body.title || ""}\n\n${body.description || ""}`;
      if (Array.isArray(body.timestamps)) {
        out += "\n\nTimestamps:\n" + body.timestamps.map(t => `${t.time}  ${t.label}`).join("\n");
      }
      return out;
    }
    function bodyText(platform, body) {
      switch (platform) {
        case "linkedin": return body.content || JSON.stringify(body, null, 2);
        case "twitter": return renderTwitter(body);
        case "instagram": return body.caption || JSON.stringify(body, null, 2);
        case "youtube": return renderYoutube(body);
        default: return JSON.stringify(body, null, 2);
      }
    }
    async function loadPosts() {
      const res = await fetch("/api/scheduled-posts");
      const data = await res.json();
      const grid = document.getElementById("grid");
      const badge = document.getElementById("count-badge");
      badge.textContent = `${data.count} post${data.count === 1 ? "" : "s"}`;
      if (data.count === 0) {
        grid.innerHTML = `<div class="empty-state">No posts scheduled yet. Trigger the n8n workflow to populate this dashboard.</div>`;
        return;
      }
      grid.innerHTML = data.posts.map(p => `
        <div class="card ${p.platform}">
          <div class="card-header">
            <span class="platform-tag">${p.platform}</span>
            <span class="timestamp">${new Date(p.receivedAt).toLocaleString()}</span>
          </div>
          <div class="card-body">${bodyText(p.platform, p.body).replace(/</g, "&lt;")}</div>
          <div class="status-pill">Queued</div>
        </div>
      `).join("");
    }
    loadPosts();
    setInterval(loadPosts, 5000);
  </script>
</body>
</html>
